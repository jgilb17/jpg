[project]
name = "servicetrade-mcp"
version = "0.1.0"
description = "MCP server exposing the ServiceTrade API to Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "servicetrade>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servicetrade_mcp"]
